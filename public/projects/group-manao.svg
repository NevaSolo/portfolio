<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Illustration: commerce & vente (boutique, panier, croissance) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071433"/>
      <stop offset="1" stop-color="#0c1b2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.66" cy="0.34" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- Growth bars + trend -->
  <g transform="translate(560 610)">
    <rect x="0" y="-90" width="70" height="90" rx="12" fill="url(#bar)"/>
    <rect x="100" y="-150" width="70" height="150" rx="12" fill="url(#bar)"/>
    <rect x="200" y="-120" width="70" height="120" rx="12" fill="url(#bar)"/>
    <rect x="300" y="-220" width="70" height="220" rx="12" fill="url(#bar)"/>
    <path d="M10 -130 L135 -200 L235 -170 L335 -290 L420 -340" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M392 -350 L428 -344 L418 -308" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Shopping bag -->
  <g transform="translate(990 150)">
    <path d="M70 0 C70 -70 190 -70 190 0" fill="none" stroke="#93c5fd" stroke-width="22" stroke-linecap="round"/>
    <path d="M0 0 H260 L290 400 H-30 Z" fill="url(#bag)" stroke="#1e3a8a" stroke-opacity="0.4" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="70" cy="56" r="13" fill="#0b1d4f"/>
    <circle cx="190" cy="56" r="13" fill="#0b1d4f"/>
    <!-- Price tag on the bag -->
    <g transform="translate(60 190) rotate(-12)">
      <path d="M0 0 H130 L170 40 L130 80 H0 Z" fill="#fef3c7"/>
      <circle cx="140" cy="40" r="9" fill="#2563eb"/>
      <rect x="22" y="24" width="80" height="12" rx="6" fill="#0b1d4f" fill-opacity="0.6"/>
      <rect x="22" y="46" width="52" height="12" rx="6" fill="#0b1d4f" fill-opacity="0.35"/>
    </g>
  </g>

  <!-- Cart icon + floating dots -->
  <g transform="translate(680 220)" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-70 -50 H-46 L-24 30 H50 L66 -24 H-36"/>
    <circle cx="-16" cy="58" r="9" fill="#22d3ee" stroke="none"/>
    <circle cx="42" cy="58" r="9" fill="#22d3ee" stroke="none"/>
  </g>
  <g fill="#93c5fd" fill-opacity="0.6">
    <circle cx="700" cy="180" r="8"/>
    <circle cx="980" cy="120" r="6"/>
    <circle cx="1480" cy="420" r="7"/>
  </g>
</svg>
