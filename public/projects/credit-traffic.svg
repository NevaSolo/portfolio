<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Illustration: suivi du trafic du crédit (dashboard + flux) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06201f"/>
      <stop offset="1" stop-color="#0b1424"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- Dashboard panel -->
  <g transform="translate(640 130)">
    <rect width="640" height="420" rx="28" fill="#0f2a2c" fill-opacity="0.85" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="36" cy="34" r="7" fill="#f87171"/>
    <circle cx="60" cy="34" r="7" fill="#fbbf24"/>
    <circle cx="84" cy="34" r="7" fill="#34d399"/>
    <!-- KPI pills -->
    <rect x="36" y="70" width="170" height="64" rx="14" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="52" y="86" width="70" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="52" y="106" width="110" height="16" rx="8" fill="#2dd4bf"/>
    <rect x="226" y="70" width="170" height="64" rx="14" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="242" y="86" width="70" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="242" y="106" width="90" height="16" rx="8" fill="#fbbf24"/>
    <rect x="416" y="70" width="188" height="64" rx="14" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="432" y="86" width="70" height="10" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="432" y="106" width="130" height="16" rx="8" fill="#22d3ee"/>
    <!-- Area chart -->
    <g transform="translate(36 160)">
      <path d="M0 200 L0 150 C60 140 90 90 150 100 S250 160 310 110 S410 30 470 50 S540 20 568 10 L568 200 Z" fill="url(#area)"/>
      <path d="M0 150 C60 140 90 90 150 100 S250 160 310 110 S410 30 470 50 S540 20 568 10" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round"/>
      <circle cx="310" cy="110" r="9" fill="#0f2a2c" stroke="#2dd4bf" stroke-width="4"/>
      <circle cx="568" cy="10" r="9" fill="#0f2a2c" stroke="#2dd4bf" stroke-width="4"/>
      <line x1="0" y1="200" x2="568" y2="200" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    </g>
  </g>

  <!-- Flow of credit: dashed path with coins (kept above the card's title zone) -->
  <g transform="translate(0 -150)">
  <path d="M520 760 C700 700 760 620 900 640 S1150 760 1360 600" fill="none" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="4" stroke-dasharray="4 16" stroke-linecap="round"/>
  <g>
    <circle cx="600" cy="733" r="30" fill="url(#coin)"/>
    <circle cx="600" cy="733" r="20" fill="none" stroke="#92400e" stroke-opacity="0.45" stroke-width="3"/>
    <circle cx="905" cy="641" r="38" fill="url(#coin)"/>
    <circle cx="905" cy="641" r="26" fill="none" stroke="#92400e" stroke-opacity="0.45" stroke-width="3"/>
    <circle cx="1220" cy="700" r="26" fill="url(#coin)"/>
    <circle cx="1220" cy="700" r="17" fill="none" stroke="#92400e" stroke-opacity="0.45" stroke-width="3"/>
  </g>
  </g>
  <!-- Arrow up badge -->
  <g transform="translate(1250 520)">
    <circle r="54" fill="#14b8a6"/>
    <path d="M-18 14 L0 -16 L18 14 M0 -16 V26" fill="none" stroke="#06201f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
