<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Illustration: gestion des demandes d'achat (documents + circuit de validation) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1405"/>
      <stop offset="1" stop-color="#120d1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.66" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- Stack of purchase requests -->
  <g transform="translate(840 90) scale(0.92)">
    <rect x="-40" y="40" width="300" height="390" rx="22" fill="#3a2a10" transform="rotate(-10 110 235)"/>
    <rect x="-10" y="20" width="300" height="390" rx="22" fill="#4a3514" transform="rotate(-4 140 215)"/>
    <g>
      <rect x="20" y="0" width="300" height="390" rx="22" fill="#fff7ea"/>
      <rect x="52" y="36" width="140" height="18" rx="9" fill="#f59e0b"/>
      <rect x="52" y="78" width="236" height="10" rx="5" fill="#1f1405" fill-opacity="0.2"/>
      <rect x="52" y="102" width="200" height="10" rx="5" fill="#1f1405" fill-opacity="0.2"/>
      <!-- table rows -->
      <g fill="#1f1405" fill-opacity="0.12">
        <rect x="52" y="146" width="236" height="34" rx="8"/>
        <rect x="52" y="190" width="236" height="34" rx="8"/>
        <rect x="52" y="234" width="236" height="34" rx="8"/>
      </g>
      <g fill="#1f1405" fill-opacity="0.45">
        <rect x="66" y="158" width="90" height="10" rx="5"/>
        <rect x="66" y="202" width="120" height="10" rx="5"/>
        <rect x="66" y="246" width="70" height="10" rx="5"/>
        <rect x="226" y="158" width="48" height="10" rx="5"/>
        <rect x="226" y="202" width="48" height="10" rx="5"/>
        <rect x="226" y="246" width="48" height="10" rx="5"/>
      </g>
      <rect x="52" y="300" width="110" height="44" rx="22" fill="#f59e0b"/>
    </g>
    <!-- Approved stamp -->
    <g transform="translate(320 330)">
      <circle r="62" fill="#22c55e"/>
      <path d="M-26 2 L-6 22 L28 -18" fill="none" stroke="#052e16" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Approval workflow: Demande -> Validation -> Achat -->
  <g transform="translate(540 625) scale(0.85)">
    <path d="M60 0 H360 M420 0 H720" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/>
    <g>
      <circle cx="0" cy="0" r="56" fill="#2a1d08" stroke="#f59e0b" stroke-width="4"/>
      <rect x="-18" y="-24" width="36" height="46" rx="6" fill="none" stroke="#fbbf24" stroke-width="6"/>
      <path d="M-8 -8 H8 M-8 6 H8" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(390 0)">
      <circle r="56" fill="#2a1d08" stroke="#f59e0b" stroke-width="4"/>
      <circle cy="-8" r="14" fill="none" stroke="#fbbf24" stroke-width="6"/>
      <path d="M-24 26 C-20 8 20 8 24 26" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g transform="translate(780 0)">
      <circle r="56" fill="#f59e0b"/>
      <path d="M-24 -14 H24 L18 22 H-18 Z" fill="none" stroke="#1f1405" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-10 -14 C-10 -32 10 -32 10 -14" fill="none" stroke="#1f1405" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
